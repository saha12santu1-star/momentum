name: Build Momentum APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q -o Momentum_github_cloud_build.zip
          unzip -q -o Momentum_v15_build_ready.zip

      - name: Configure memory
        run: |
          echo "android.useAndroidX=true" >> Momentum_v15/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> Momentum_v15/gradle.properties
          echo "org.gradle.workers.max=2" >> Momentum_v15/gradle.properties

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: Momentum_v15
        run: gradle :app:assembleDebug --no-daemon --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Momentum-debug-apk
          path: Momentum_v15/app/build/outputs/apk/debug/app-debug.apk
