name: Build Momentum APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -e
          unzip -q -o Momentum_github_cloud_build.zip

          BUILD_ZIP=$(find . -maxdepth 2 -type f -name '*_build_ready.zip' | head -n 1)
          if [ -z "$BUILD_ZIP" ]; then
            echo "No *_build_ready.zip found"
            exit 1
          fi

          echo "Using project archive: $BUILD_ZIP"
          unzip -q -o "$BUILD_ZIP"

          PROJECT_DIR=$(find . -type f -name 'settings.gradle.kts' -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "No Gradle project found"
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected project: $PROJECT_DIR"

      - name: Configure build
        run: |
          cat > "$PROJECT_DIR/gradle.properties" <<'EOF2'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          kotlin.daemon.jvm.options=-Xmx1536m
          org.gradle.workers.max=2
          org.gradle.parallel=false
          EOF2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Momentum-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
