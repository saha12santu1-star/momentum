name: Build Momentum APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Momentum project
        run: |
          unzip -q -o Momentum_github_cloud_build.zip 'Momentum_v8_build_ready.zip'
          unzip -q -o Momentum_v8_build_ready.zip
          ls -la Momentum_v8

      - name: Enable AndroidX
        run: echo "android.useAndroidX=true" >> Momentum_v8/gradle.properties

      - name: Fix Android source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("Momentum_v8/app/src/main/java/com/momentum/app/Habit.kt")
          s = p.read_text()

          s = s.replace(
              "import androidx.room.Entity",
              "import androidx.room.Entity\nimport androidx.room.PrimaryKey"
          )

          s = s.replace(
              "data class Habit(val id:Long=0,",
              "data class Habit(@PrimaryKey(autoGenerate=true) val id:Long=0,"
          )

          p.write_text(s)
          print(p.read_text())
          PY

      - name: Set Java 17 targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("Momentum_v8/app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions" not in s:
              s = s.replace(
                  "android {",
                  """android {
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
"""
              )

          p.write_text(s)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: Momentum_v8
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Momentum-debug-apk
          path: Momentum_v8/app/build/outputs/apk/debug/app-debug.apk
