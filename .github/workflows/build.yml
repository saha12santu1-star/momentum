name: Build Reflection APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q -o Momentum_github_cloud_build.zip

          for ZIP in *_build_ready.zip; do
            if [ -f "$ZIP" ]; then
              echo "Extracting $ZIP"
              unzip -q -o "$ZIP"
            fi
          done

      - name: Find Android project
        run: |
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            PROJECT_DIR="."
          else
            PROJECT_DIR=$(find . -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit | xargs dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find Android project"
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure memory
        run: |
          echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> "$PROJECT_DIR/gradle.properties"
          echo "org.gradle.workers.max=2" >> "$PROJECT_DIR/gradle.properties"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --max-workers=2

      - name: Show APK SHA-1
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          echo "========================================"
          echo "APK: $APK"
          echo "========================================"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

          echo "Using: $APKSIGNER"
          echo ""

          "$APKSIGNER" verify --print-certs "$APK"

          echo ""
          echo "========================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reflection-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
