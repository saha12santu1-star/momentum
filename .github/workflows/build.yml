name: Build Momentum APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Momentum project
        run: |
          unzip -q -o Momentum_github_cloud_build.zip 'Momentum_v10_build_ready.zip'
          rm -rf Momentum_v10
          mkdir Momentum_v10
          unzip -q -o Momentum_v10_build_ready.zip -d Momentum_v10

      - name: Configure build memory
        run: |
          cat > Momentum_v10/gradle.properties <<'EOF2'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          kotlin.daemon.jvm.options=-Xmx1536m
          org.gradle.workers.max=2
          org.gradle.parallel=false
          EOF2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: Momentum_v10
        run: gradle :app:assembleDebug --stacktrace --no-daemon --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Momentum-v1.0-debug-apk
          path: Momentum_v10/app/build/outputs/apk/debug/app-debug.apk
