name: Build Momentum APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q -o Momentum_github_cloud_build.zip 'Momentum_v8_build_ready.zip'
          unzip -q -o Momentum_v8_build_ready.zip

      - name: Enable AndroidX
        run: echo "android.useAndroidX=true" >> Momentum_v8/gradle.properties

      - name: Fix Room Primary Key
        run: |
          sed -i '/import androidx.room.Entity/a import androidx.room.PrimaryKey' Momentum_v8/app/src/main/java/com/momentum/app/Habit.kt
          sed -i 's/data class Habit(val id:Long=0,/data class Habit(@PrimaryKey(autoGenerate=true) val id:Long=0,/' Momentum_v8/app/src/main/java/com/momentum/app/Habit.kt

      - name: Set Java 17
        run: |
          sed -i '/android {/a\
              compileOptions {\
                  sourceCompatibility = JavaVersion.VERSION_17\
                  targetCompatibility = JavaVersion.VERSION_17\
              }\
              kotlinOptions {\
                  jvmTarget = "17"\
              }' Momentum_v8/app/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: Momentum_v8
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Momentum-debug-apk
          path: Momentum_v8/app/build/outputs/apk/debug/app-debug.apk
