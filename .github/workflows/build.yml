name: Build Momentum APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Momentum project
        run: |
          unzip -q -o Momentum_github_cloud_build.zip 'Momentum_v15_build_ready.zip'
          unzip -q -o Momentum_v15_build_ready.zip

      - name: Configure build memory
        run: |
          cat > Momentum_v15/gradle.properties <<'EOF2'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          kotlin.daemon.jvm.options=-Xmx1536m
          org.gradle.workers.max=2
          org.gradle.parallel=false
          EOF2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
