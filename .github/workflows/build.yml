name: Build Reflection APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q -o Momentum_github_cloud_build_v43_fixed.zip

      - name: Configure memory
        run: |
          PROJECT_DIR=$(find . -maxdepth 1 -type d -name 'Momentum_v43*' -print -quit)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> "$PROJECT_DIR/gradle.properties"
          echo "org.gradle.workers.max=2" >> "$PROJECT_DIR/gradle.properties"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --max-workers=2

      - name: Show APK SHA-1
        run: |
          APK=$(find "$PROJECT_DIR" -path "*/app/build/outputs/apk/debug/app-debug.apk" -print -quit)

          echo "========================================"
          echo "APK: $APK"
          echo "========================================"

          keytool -printcert -jarfile "$APK" | grep -i "SHA1"

          echo "========================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reflection-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
