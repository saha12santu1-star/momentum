name: Build Reflection APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q -o Momentum_github_cloud_build.zip
          unzip -q -o Momentum_v42_build_ready.zip

      - name: Configure memory
        run: |
          echo "android.useAndroidX=true" >> Momentum_v42/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> Momentum_v42/gradle.properties
          echo "org.gradle.workers.max=2" >> Momentum_v42/gradle.properties

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: Momentum_v42
        run: gradle :app:assembleDebug --no-daemon --max-workers=2

      - name: Show APK SHA-1
        run: |
          APK="Momentum_v42/app/build/outputs/apk/debug/app-debug.apk"

          echo "========================================"
          echo "APK: $APK"
          echo "========================================"

          keytool -printcert -jarfile "$APK" | grep -i "SHA1"

          echo "========================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reflection-debug-apk
          path: Momentum_v42/app/build/outputs/apk/debug/app-debug.apk
